
services:
  # The central state for the whole agent
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Bootstrap: clears stale lock:* keys left over from a hard crash / power cut
  # before any worker starts. Runs once and exits.
  pga-bootstrap:
    image: redis:alpine
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
        until [ \"$$(redis-cli -h redis INFO persistence 2>/dev/null | grep -c '^loading:0')\" = '1' ]; do
          echo '[bootstrap] waiting for redis to finish loading...'; sleep 1;
        done;
        redis-cli -h redis --scan --pattern 'lock:*' | xargs -r redis-cli -h redis DEL;
        echo '[bootstrap] stale locks cleared'
      "

  # Telegram Monitor Service
  pga-telegram:
    build: .
    restart: unless-stopped
    # Interactive mode for initial authentication (run: docker compose run --rm pga-telegram)
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./tdlib-data:/app/tdlib-data
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/ingestion/telegramMonitor.ts

  # Copytrading Strategy Worker
  pga-copytrade:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/copytrade/worker.ts

  # Futures Monitoring Strategy
  pga-futures:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/monitor/futuresMonitor.ts

  # Arbitrage Scanning Engine
  pga-arb:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/arb/worker.ts

  # CLOB Flow Monitor — streams Polymarket book/trade tape into Redis
  pga-clob-flow:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/clob/flowMonitor.ts

  # Sports Arb Poller — NBA/NHL in-play edge vs Polymarket
  pga-sports:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/sports/poller.ts

  # Spot Feed Management
  pga-spot-feed:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/spot/feeds/manager.ts
