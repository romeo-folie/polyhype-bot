
services:
  # The central state for the whole agent
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Bootstrap: clears stale lock:* keys left over from a hard crash / power cut
  # before any worker starts. Runs once and exits.
  pga-bootstrap:
    image: redis:alpine
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
        until [ \"$$(redis-cli -h redis INFO persistence 2>/dev/null | grep -c '^loading:0')\" = '1' ]; do
          echo '[bootstrap] waiting for redis to finish loading...'; sleep 1;
        done;
        redis-cli -h redis --scan --pattern 'lock:*' | xargs -r redis-cli -h redis DEL;
        echo '[bootstrap] stale locks cleared'
      "

  # Telegram Monitor Service
  pga-telegram:
    build: .
    restart: unless-stopped
    # Interactive mode for initial authentication (run: docker compose run --rm pga-telegram)
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./tdlib-data:/app/tdlib-data
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/ingestion/telegramMonitor.ts

  # Copytrading Strategy Worker
  pga-copytrade:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/copytrade/worker.ts

  # Position Monitor — persistent worker (replaces the 1-min cron entrypoint).
  # Shares the `monitor:lock` Redis key with the cron, so during cutover the
  # cron will simply skip. Wraps runMonitorInner in a tight loop and keeps the
  # ClobPriceFeed WS cache warm between cycles.
  pga-monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/monitor/worker.ts
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Futures Monitoring Strategy
  pga-futures:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/monitor/futuresMonitor.ts

  # Arbitrage Scanning Engine
  pga-arb:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/arb/worker.ts
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # CLOB Flow Monitor — streams Polymarket book/trade tape into Redis
  pga-clob-flow:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/clob/flowMonitor.ts

  # Sports Arb Poller — NBA/NHL in-play edge vs Polymarket
  pga-sports:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/sports/poller.ts

  # Spot Feed Management
  pga-spot-feed:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
    command: npx tsx src/spot/feeds/manager.ts
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      # Passes if the spot-feed heartbeat was written within the last 120s.
      test:
        - "CMD-SHELL"
        - >
          node -e "const{Redis}=require('ioredis');const r=new Redis('redis://redis:6379');r.get('heartbeat:spot-feed').then(v=>{const age=Math.floor(Date.now()/1000)-Number(v||0);process.exit(age<120?0:1)}).catch(()=>process.exit(1)).finally(()=>r.disconnect());"
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # Epic #142 — Durable analytics + retrieval layer
  # ─────────────────────────────────────────────────────────────────────────
  #
  # pga-db          — Postgres 16 + TimescaleDB + pgvector (timescaledb-ha)
  # pga-db-migrate  — one-shot node-pg-migrate runner; exits 0 on success
  # pga-db-writer   — XREADGROUP consumer that drains db:writeq into PG
  #
  # All three are NEW; the existing workers are untouched. Compose will only
  # touch them when the user runs `docker compose up -d --build pga-db
  # pga-db-migrate pga-db-writer`. There is no implicit dependency from any
  # existing service into the new ones — the writer fans in via the Redis
  # stream, which is fire-and-forget on the producer side (see
  # src/db/writeQueue.ts).
  #
  # Phase 1 ships with a trivial canary table `health_pings` that round-trips
  # through the stream every 30s. Real schema lands in Phase 2 (#144).

  pga-db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    # 5432 is intentionally NOT exposed to the host. From the host use
    # `docker compose exec pga-db psql -U pga -d pga`.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: pga
      POSTGRES_DB: pga
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - shared_preload_libraries=timescaledb,vector
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pga -d pga"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 900M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pga-db-migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      # node-pg-migrate reads the URL from $DATABASE_URL (the --database-url-var arg).
      # Password is injected at command-execution time from the file secret to keep
      # it out of the env block (which leaks via `docker inspect`).
      DATABASE_URL_NOPASS: postgres://pga@pga-db:5432/pga?sslmode=disable
    depends_on:
      pga-db:
        condition: service_healthy
    secrets:
      - pg_password
    command:
      - sh
      - -c
      - |
        PGPASS=$$(cat /run/secrets/pg_password) && \
        export DATABASE_URL="postgres://pga:$${PGPASS}@pga-db:5432/pga?sslmode=disable" && \
        exec npx node-pg-migrate --database-url-var DATABASE_URL --migrations-dir src/db/migrations --migration-filename-format utc up
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  pga-db-writer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      # PG_URL is built at command time so the password file stays off the env block.
      PG_URL_NOPASS: postgres://pga@pga-db:5432/pga?sslmode=disable
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
      pga-db-migrate:
        condition: service_completed_successfully
    secrets:
      - pg_password
    command:
      - sh
      - -c
      - |
        PGPASS=$$(cat /run/secrets/pg_password) && \
        export PG_URL="postgres://pga:$${PGPASS}@pga-db:5432/pga?sslmode=disable" && \
        exec npx tsx src/db/writer/index.ts
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      # Reads heartbeat:writer (unix seconds) from Redis using a tiny Node one-liner —
      # avoids installing redis-cli inside the app image. Stale > 30s = unhealthy.
      test:
        - "CMD-SHELL"
        - >
          node -e "const{Redis}=require('ioredis');const r=new Redis('redis://redis:6379');r.get('heartbeat:writer').then(v=>{const age=Math.floor(Date.now()/1000)-Number(v||0);process.exit(age<30?0:1)}).catch(()=>process.exit(1)).finally(()=>r.disconnect());"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Phase 4/5 analytics crons ─────────────────────────────────────────────
  #
  # pga-cron   — nightly loop: embed trade memory + snapshot telemetry counters
  #              + refresh outcomes_daily materialized view.
  # pga-db-backup — nightly pg_dump → ./backups/ with 7-day retention.

  pga-cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PG_URL_NOPASS: postgres://pga@pga-db:5432/pga?sslmode=disable
    depends_on:
      pga-bootstrap:
        condition: service_completed_successfully
      pga-db-migrate:
        condition: service_completed_successfully
    secrets:
      - pg_password
    command:
      - sh
      - -c
      - |
        PGPASS=$$(cat /run/secrets/pg_password) && \
        export PG_URL="postgres://pga:$${PGPASS}@pga-db:5432/pga?sslmode=disable" && \
        while true; do
          echo '[pga-cron] running embedTradeMemory' && \
          npx tsx src/cron/embedTradeMemory.ts 2>&1 || true
          echo '[pga-cron] running snapshotTelemetry' && \
          npx tsx src/cron/snapshotTelemetry.ts 2>&1 || true
          echo '[pga-cron] running weatherReconciler' && \
          npx tsx src/weather/weatherReconciler.ts 2>&1 || true
          echo '[pga-cron] sleeping 24h'
          sleep 86400
        done
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  pga-db-backup:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    depends_on:
      pga-db:
        condition: service_healthy
    secrets:
      - pg_password
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
        while true; do
          PGPASSWORD=$$(cat /run/secrets/pg_password) \
          pg_dump -h pga-db -U pga -d pga -F c -Z 9 \
            -f /backups/pga_$$(date +%Y%m%d_%H%M%S).dump && \
          echo '[backup] dump complete' || \
          echo '[backup] dump FAILED';
          find /backups -name '*.dump' -mtime +7 -delete;
          echo '[backup] pruned old dumps';
          sleep 86400;
        done
      "
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

secrets:
  pg_password:
    file: ./secrets/pg_password
